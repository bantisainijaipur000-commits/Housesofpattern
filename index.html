<!DOCTYPE html>
<html>
<head>
<title>Kutti Hub Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;

  /* ✅ BACKGROUND IMAGE WAPAS */
  background-image: url("https://images.unsplash.com/photo-1521336575822-6da63fb45455");
  background-size: cover;
  background-position: center;
}

/* HEADER */
.header {
  text-align: center;
  color: white;
  background: rgba(0,0,0,0.6);
  padding: 15px;
}

/* SEARCH */
#search {
  display: block;
  margin: 20px auto;
  padding: 10px;
}

/* PRODUCTS */
.container {
  text-align: center;
}

.product {
  background: white;
  width: 200px;
  margin: 10px;
  display: inline-block;
  padding: 10px;
  border-radius: 10px;
}

button {
  margin: 3px;
  padding: 6px;
  border: none;
  cursor: pointer;
  background: pink;
}

.buy {
  background: green;
  color: white;
}

/* ✅ CART NICHE AA GAYA */
.cart {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>👗 Kutti Hub - Women Wear</h1>
</div>

<!-- SEARCH -->
<input type="text" id="search" placeholder="Search..." onkeyup="searchProduct()">

<!-- PRODUCTS -->
<div class="container">

<div class="product" data-name="Floral Dress">
  <h3>Floral Dress</h3>
  <p>₹999</p>
  <button onclick="addToCart('Floral Dress',999)">Add</button>
  <button class="buy" onclick="buyNow('Floral Dress',999)">Buy Now</button>
</div>

<div class="product" data-name="Casual Top">
  <h3>Casual Top</h3>
  <p>₹499</p>
  <button onclick="addToCart('Casual Top',499)">Add</button>
  <button class="buy" onclick="buyNow('Casual Top',499)">Buy Now</button>
</div>

<div class="product" data-name="Kurti">
  <h3>Kurti</h3>
  <p>₹799</p>
  <button onclick="addToCart('Kurti',799)">Add</button>
  <button class="buy" onclick="buyNow('Kurti',799)">Buy Now</button>
</div>

</div>

<!-- 🛒 CART (AB NICHE) -->
<div class="cart">
  <h2>🛒 Cart</h2>
  <ul id="cartItems"></ul>
  <h3>Total: ₹<span id="total">0</span></h3>
  <button onclick="placeOrder()">Place Order</button>
</div>

<script>
let total = 0;

/* ADD */
function addToCart(name, price) {
  let list = document.getElementById("cartItems");

  let item = document.createElement("li");
  item.innerHTML = `
    ${name} - ₹${price}
    <button onclick="removeItem(this, ${price})">❌</button>
  `;

  list.appendChild(item);
  total += price;
  document.getElementById("total").innerText = total;
}

/* REMOVE */
function removeItem(btn, price) {
  btn.parentElement.remove();
  total -= price;
  document.getElementById("total").innerText = total;
}

/* BUY NOW */
function buyNow(name, price) {
  alert("🎉 Order Placed!\n" + name + " ₹" + price);
}

/* ORDER */
function placeOrder() {
  if (total === 0) {
    alert("Cart empty!");
    return;
  }

  alert("🎉 Order Placed Successfully!");

  let items = document.getElementById("cartItems").innerText;
  let msg = "Order:\n" + items + "\nTotal: ₹" + total;

  window.open("https://wa.me/91XXXXXXXXXX?text=" + encodeURIComponent(msg));

  document.getElementById("cartItems").innerHTML = "";
  total = 0;
  document.getElementById("total").innerText = total;
}

/* SEARCH */
function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let products = document.getElementsByClassName("product");

  for (let i = 0; i < products.length; i++) {
    let name = products[i].getAttribute("data-name").toLowerCase();
    products[i].style.display = name.includes(input) ? "inline-block" : "none";
  }
}
</script>

</body>
</html>
